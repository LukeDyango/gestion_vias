<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Guarda en el almacenamiento del navegador (localStorage del celular) los borradores de la
// app -- colleras a medio marcar, Reporte Diario a medio llenar, pantalla actual y la sesión
// recordada -- para que no se pierdan si la página se cae, se recarga o Streamlit se reinicia.
// 1) Al abrirse, lee lo guardado y se lo entrega a la app (una sola vez).
// 2) Después, cada vez que la app le pasa datos (ya restaurados), los escribe.
(function () {
  const CLAVE = "gestion_vias_app_v1";
  let entregado = false;
  let ultimoEscrito = null;

  function enviar(tipo, datos) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, datos), "*");
  }

  function leer() {
    try {
      const texto = window.localStorage.getItem(CLAVE);
      return texto ? JSON.parse(texto) : null;
    } catch (e) {
      return null; // navegación privada o almacenamiento bloqueado: la app sigue sin esto
    }
  }

  window.addEventListener("message", function (evento) {
    const datos = evento.data || {};
    if (datos.type !== "streamlit:render") return;
    const args = datos.args || {};
    if (!entregado) {
      entregado = true;
      enviar("streamlit:setComponentValue", { value: { cargado: leer(), t: Date.now() }, dataType: "json" });
      return;
    }
    // Solo escribe cuando la app ya restauró lo leído (si no, pisaría lo guardado con vacío).
    if (!args.restaurado || args.datos === undefined || args.datos === null) return;
    try {
      const texto = JSON.stringify(args.datos);
      if (texto !== ultimoEscrito) {
        window.localStorage.setItem(CLAVE, texto);
        ultimoEscrito = texto;
      }
    } catch (e) {}
  });

  enviar("streamlit:componentReady", { apiVersion: 1 });
  enviar("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
